name: Validate, build, and test on every push

on: [push]

jobs:
  test:
    name: Test & Build Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'yarn'
      - name: Install dependencies
        uses: borales/actions-yarn@v5
        with:
          cmd: install
      - name: Run prettier
        uses: borales/actions-yarn@v5
        with:
          cmd: format
      - name: Lint JS files
        uses: borales/actions-yarn@v5
        with:
          cmd: lint
      - name: Check TypeScript
        uses: borales/actions-yarn@v5
        with:
          cmd: type-check
      - name: Build
        uses: borales/actions-yarn@v5
        with:
          cmd: build
      - name: Test
        uses: borales/actions-yarn@v5
        with:
          cmd: test
        env:
          ETH_NETWORK: 'sepolia'
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TESTNET_ALCHEMY_API_KEY: ${{ secrets.TESTNET_ALCHEMY_API_KEY }}
          ETH_ACCOUNT_PRIVATE_KEY: ${{ secrets.ETH_ACCOUNT_PRIVATE_KEY }}
          INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
          TESTNET_COLLECTION_CONTRACT_ADDRESS: ${{ secrets.TESTNET_COLLECTION_CONTRACT_ADDRESS }}
