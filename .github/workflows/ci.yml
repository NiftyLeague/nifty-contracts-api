name: Validate, build, and test on every push

on: [push]

jobs:
  test:
    name: Test & Build Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'yarn'
      - name: Install dependencies
        uses: borales/actions-yarn@v4
        with:
          cmd: install
      - name: Run prettier
        uses: borales/actions-yarn@v4
        with:
          cmd: format
      - name: Lint JS files
        uses: borales/actions-yarn@v4
        with:
          cmd: lint
      - name: Check TypeScript
        uses: borales/actions-yarn@v4
        with:
          cmd: type-check
      - name: Build
        uses: borales/actions-yarn@v4
        with:
          cmd: build
        env:
          ETH_NETWORK: sepolia
          OPENSEA_API_KEY: XXXXX
          OWNER_ACCOUNT_PRIVATE_KEY: XXXXX
          OWNER_ACCOUNT_PUBLIC_KEY: XXXXX
          OWNER_ACCOUNT_ADDRESS: 0x000000000000000000000000000000000000000
          COLLECTION_CONTRACT_ADDRESS: 0xF1863D85095AA932de5BccEBE02Dac0b67303383
          COLLECTION_PROJECT_ID: 10070
          UNITY_IMAGE_GENERATOR_BASE_URL: http://localhost:5003/
          UNITY_IMAGE_GENERATOR_SECRET: XXXXX
          UNITY_IMAGE_GENERATOR_VERSION: 92
