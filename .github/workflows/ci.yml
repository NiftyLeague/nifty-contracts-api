name: Validate, build, and test on every push

on: [push]

jobs:
  test:
    name: Test & Build Code
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20]
        pnpm-version: [8]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup pnpm ${{ matrix.pnpm-version }}
        uses: pnpm/action-setup@v4
        with:
          version: ${{ matrix.pnpm-version }}
      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install
      - name: Run prettier
        run: pnpm format
      - name: Lint JS files
        run: pnpm lint
      - name: Check TypeScript
        run: pnpm type-check
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test
        env:
          ETH_NETWORK: 'sepolia'
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TESTNET_ALCHEMY_API_KEY: ${{ secrets.TESTNET_ALCHEMY_API_KEY }}
          ETH_ACCOUNT_PRIVATE_KEY: ${{ secrets.ETH_ACCOUNT_PRIVATE_KEY }}
          INFURA_PROJECT_ID: ${{ secrets.INFURA_PROJECT_ID }}
          TESTNET_COLLECTION_CONTRACT_ADDRESS: ${{ secrets.TESTNET_COLLECTION_CONTRACT_ADDRESS }}
